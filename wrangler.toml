# EkGuru Payment & Support API — Cloudflare Workers Configuration
# Worker Name: ekguru-payment-api
# Target Host: api.ekguru.shop

name = "ekguru-payment-api"
main = "server/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "api.ekguru.shop/*", zone_name = "ekguru.shop" }
]

[vars]
