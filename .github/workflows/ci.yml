name: ci

# Connected-CI home for the gates the audit sandbox cannot run:
#   · network data-source tests (live published-Sheet endpoints)
#   · the full jsdom browser-QA suites
#   · the master build check (every generated layer, incl. the
#     27 Sep 2026 sheet-policy + no-competitor-attribution gates)
# The site itself deploys from `main` via GitHub Pages (CNAME).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies (jsdom)
        run: npm install --no-audit --no-fund

      - name: Owner indexing and canonical freeze
        run: python3 tools/ultra/contract.py

      - name: Master build check (all generated layers + policy gates)
        run: python3 tools/build-all.py check

      - name: "PHASE 3 content gate (Learn-tab posts: 1000+ words, linked, correctly indexed)"
        run: python3 tools/test-phase3-content.py

      - name: Readiness preflights
        run: |
          python3 tools/audit-adsense-readiness.py --selftest
          python3 tools/audit-adsense-readiness.py
          python3 tools/language-gate.py --selftest
          node tools/adsready.js --local

      - name: Page inventory (SEO/sitemap/noindex gates)
        run: python3 tools/build-full-page-inventory.py

      - name: "Data-source tests (network: published Sheet endpoints, csv -> tsv fallback)"
        run: |
          python3 tools/test-data-sources.py 2>&1 | tee /tmp/ds.out
          ec=${PIPESTATUS[0]}
          { echo "### test-data-sources.py (exit $ec)"; echo '```'; grep -E "FAIL|failures —|MODE=" /tmp/ds.out || true; tail -n 25 /tmp/ds.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ $ec -ne 0 ]; then grep -E "FAIL|Error|Traceback" /tmp/ds.out | head -6 | while IFS= read -r l; do echo "::error title=test-data-sources::$l"; done; fi
          exit $ec

      - name: Sheet loader live smoke (csv -> tsv fallback applies cleanly)
        run: |
          node tools/test-sheet-loader.js 2>&1 | tee /tmp/sl.out
          ec=${PIPESTATUS[0]}
          { echo "### test-sheet-loader.js (exit $ec)"; echo '```'; grep -E "FAIL|PASS|fallback" /tmp/sl.out || true; tail -n 25 /tmp/sl.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ $ec -ne 0 ]; then grep -E "FAIL|Error" /tmp/sl.out | head -6 | while IFS= read -r l; do echo "::error title=test-sheet-loader::$l"; done; fi
          exit $ec

      - name: Sheet sync policy (runtime + build side, adversarial)
        run: |
          node tools/test-sheet-apply.js
          node tools/test-sheetsync-policy.js
          node tools/test-sheet-fetch.mjs

      - name: Tutor re-activation cycle (active=yes/no restores everything)
        run: |
          node tools/test-tutor-activation.mjs

      - name: Public-output gate (competitor attribution, stale wording, origin)
        run: |
          node tools/test-no-competitor-attribution.js
          node tools/test-tutor-claims.js

      - name: jsdom browser-QA suites
        run: |
          node tools/test-browser-qa.mjs
          node tools/test-runtime-qa.mjs
          node tools/test-consent-release.mjs
          node tools/test-ad-policy.mjs
          node tools/test-affiliate-disclosure.mjs
          node tools/test-course-levels.mjs
          node tools/test-course-placeholders.mjs
          node tools/test-question-api.mjs
          node tools/test-search-facets.mjs
          node tools/test-copy-index.mjs
          node tools/test-shell-drawer.mjs
          node tools/test-experience-dom.mjs
          node tools/test-level-visuals.mjs
          node tools/test-offline-playable.mjs
          node tools/test-print-sheet-dom.mjs
          node tools/test-print-visible.mjs
          node tools/test-refresh-quiet.mjs
          node tools/test-voice.mjs
          node tools/test-retention.mjs
          node tools/test-learning-storage.mjs
          node tools/test-learning-worker.mjs
          node tools/test-theme-contrast.mjs
          node tools/test-googlebot-parity.mjs
