name: ci

# Connected-CI home for the gates the audit sandbox cannot run:
#   · network data-source tests (live published-Sheet endpoints)
#   · the full jsdom browser-QA suites
#   · the master build check (every generated layer, incl. the
#     27 Sep 2026 sheet-policy + no-competitor-attribution gates)
# The site itself deploys from `main` via GitHub Pages (CNAME).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies (jsdom)
        run: npm install --no-audit --no-fund

      - name: Owner indexing and canonical freeze
        run: python3 tools/ultra/contract.py

      - name: "Demand vs coverage (reports which markets are frozen or uncovered)"
        run: python3 tools/trend-analysis.py --check

      - name: "Name spellings: generated JS matches the curated JSON"
        run: python3 tools/build-names-js.py --check

      - name: "Script conversion: exact strings, no unassigned codepoints"
        run: node tests/regression/test-script-map.mjs

      - name: "Name pages and learner trust: runtime, share privacy, offer and schema"
        run: |
          node tests/regression/test-name-page.mjs
          node tests/regression/test-name-share-privacy.mjs
          node tests/regression/test-learner-trust.mjs

      - name: "Numbers: data, generated JS and visible table agree"
        run: python3 tools/build-numbers-pages.py --check

      - name: "Numbers page: every number, and the tool that reads it"
        run: node tests/regression/test-numbers-page.mjs

      - name: "Time/days: stale-check the generated data, tables and page bodies"
        run: python3 tools/build-time-pages.py --check && python3 tools/build-time-pages-bodies.py --check
      - name: "Hindi classes page: stale-check the generated hub"
        run: python3 tools/build-hindi-classes-page.py --check
      - name: "Hindi tutor near me page: stale-check the generated hub"
        run: python3 tools/build-hindi-tutor-near-me-page.py --check

      - name: "Time/days page: English in, real script out"
        run: node tests/regression/test-time-page.mjs

      - name: Master build check (all generated layers + policy gates)
        run: python3 tools/build-all.py check

      - name: "PHASE 3 content gate (Learn-tab posts: 1000+ words, linked, correctly indexed)"
        run: python3 tests/regression/test-phase3-content.py

      - name: "Public surface gate (deploy set = website only; no contact data, no secrets)"
        run: node tests/regression/test-public-surface.mjs

      - name: Readiness preflights
        run: |
          python3 tools/audit-adsense-readiness.py --selftest
          python3 tools/audit-adsense-readiness.py
          python3 tools/language-gate.py --selftest
          node tools/adsready.js --local

      - name: Page inventory (SEO/sitemap/noindex gates)
        run: python3 tools/build-full-page-inventory.py

      - name: "Data-source tests (network: published Sheet endpoints, csv -> tsv fallback)"
        run: |
          python3 tests/unit/test-appscript-health.py
          python3 tests/integration/test-data-sources.py 2>&1 | tee /tmp/ds.out
          ec=${PIPESTATUS[0]}
          { echo "### test-data-sources.py (exit $ec)"; echo '```'; grep -E "FAIL|failures —|MODE=" /tmp/ds.out || true; tail -n 25 /tmp/ds.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ $ec -ne 0 ]; then grep -E "FAIL|Error|Traceback" /tmp/ds.out | head -6 | while IFS= read -r l; do echo "::error title=test-data-sources::$l"; done; fi
          exit $ec

      - name: Sheet loader live smoke (csv -> tsv fallback applies cleanly)
        run: |
          node tests/integration/test-sheet-loader.js 2>&1 | tee /tmp/sl.out
          ec=${PIPESTATUS[0]}
          { echo "### test-sheet-loader.js (exit $ec)"; echo '```'; grep -E "FAIL|PASS|fallback" /tmp/sl.out || true; tail -n 25 /tmp/sl.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ $ec -ne 0 ]; then grep -E "FAIL|Error" /tmp/sl.out | head -6 | while IFS= read -r l; do echo "::error title=test-sheet-loader::$l"; done; fi
          exit $ec

      - name: Sheet sync policy (runtime + build side, adversarial)
        run: |
          node tests/integration/test-sheet-apply.js
          node tests/integration/test-live-feed.js
          node tests/integration/test-intake.js
          node tests/integration/test-sheetsync-policy.js
          node tests/integration/test-sheet-fetch.mjs

      - name: Tutor re-activation cycle (active=yes/no restores everything)
        run: |
          node tests/integration/test-tutor-activation.mjs
          node tests/regression/test-orphan-tutor-quarantine.mjs

      - name: Real-life sheet cycle (reviews add/delete/replace, roster, price, offline cache)
        run: |
          node tests/integration/test-reviews-fallback.js
          node tests/integration/test-real-life-sheet-cycle.mjs
          node tests/integration/test-real-life-booking-review.mjs
          node tests/integration/test-intake-real-life.mjs

      - name: Public-output gate (competitor attribution, stale wording, origin)
        run: |
          node tests/regression/test-no-competitor-attribution.js
          node tests/regression/test-tutor-claims.js

      - name: jsdom browser-QA suites
        run: |
          node tests/regression/test-browser-qa.mjs
          node tests/regression/test-runtime-qa.mjs
          node tests/regression/test-consent-release.mjs
          node tests/regression/test-ad-policy.mjs
          node tests/regression/test-affiliate-disclosure.mjs
          node tests/regression/test-monetization-disclosures.mjs
          node tests/regression/test-adsready-diagnostics.mjs
          node tests/regression/test-name-card.mjs
          node tests/regression/test-course-levels.mjs
          node tests/regression/test-course-placeholders.mjs
          node tests/regression/test-question-api.mjs
          node tests/regression/test-search-facets.mjs
          node tests/regression/test-copy-index.mjs
          node tests/regression/test-shell-drawer.mjs
          node tests/regression/test-menu-search.mjs
          node tests/regression/test-advertising-launch.mjs
          node tests/regression/test-experience-dom.mjs
          node tests/regression/test-level-visuals.mjs
          node tests/regression/test-offline-playable.mjs
          node tests/regression/test-print-sheet-dom.mjs
          node tests/regression/test-print-visible.mjs
          node tests/regression/test-refresh-quiet.mjs
          node tests/regression/test-voice.mjs
          node tests/regression/test-retention.mjs
          node tests/regression/test-learning-storage.mjs
          node tests/regression/test-learning-worker.mjs
          node tests/regression/test-theme-contrast.mjs
          node tests/regression/test-googlebot-parity.mjs
