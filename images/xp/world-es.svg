<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640"
     role="img" aria-labelledby="t">
  <title id="t">EkGuru world emblem — Latin</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#faeff2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b91c4b" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ea580c" stop-opacity=".35"/>
    </linearGradient>
  </defs>

  <!-- The backdrop is a circle, not a square: on the dark heroes (support/,
       courses/) a square panel shows its corners and reads as a broken image. -->
  <circle cx="320" cy="320" r="288" fill="url(#bg)"/>
  <circle cx="320" cy="320" r="288" fill="#faeff2" fill-opacity=".55"/>

  <!-- rim: dashed orbit, ticks, and the three study nodes -->
  <circle cx="320" cy="320" r="288" fill="none" stroke="#b91c4b" stroke-opacity=".16"
          stroke-width="2" stroke-dasharray="10 14"/>
  <circle cx="320" cy="320" r="252" fill="none" stroke="url(#ring)" stroke-width="2"/>
  <g opacity=".8"><path d="M320 24 V48" stroke="rgba(185,28,75,0.45)" stroke-width="5" stroke-linecap="round" transform="rotate(0 320 320)"/><path d="M320 24 V38" stroke="rgba(185,28,75,0.3)" stroke-width="3" stroke-linecap="round" transform="rotate(15 320 320)"/><path d="M320 24 V48" stroke="rgba(185,28,75,0.45)" stroke-width="5" stroke-linecap="round" transform="rotate(30 320 320)"/><path d="M320 24 V38" stroke="rgba(185,28,75,0.3)" stroke-width="3" stroke-linecap="round" transform="rotate(45 320 320)"/><path d="M320 24 V48" stroke="rgba(185,28,75,0.45)" stroke-width="5" stroke-linecap="round" transform="rotate(60 320 320)"/><path d="M320 24 V38" stroke="rgba(185,28,75,0.3)" stroke-width="3" stroke-linecap="round" transform="rotate(75 320 320)"/><path d="M320 24 V48" stroke="rgba(185,28,75,0.45)" stroke-width="5" stroke-linecap="round" transform="rotate(90 320 320)"/><path d="M320 24 V38" stroke="rgba(185,28,75,0.3)" stroke-width="3" stroke-linecap="round" transform="rotate(105 320 320)"/><path d="M320 24 V48" stroke="rgba(185,28,75,0.45)" stroke-width="5" stroke-linecap="round" transform="rotate(120 320 320)"/><path d="M320 24 V38" stroke="rgba(185,28,75,0.3)" stroke-width="3" stroke-linecap="round" transform="rotate(135 320 320)"/><path d="M320 24 V48" stroke="rgba(185,28,75,0.45)" stroke-width="5" stroke-linecap="round" transform="rotate(150 320 320)"/><path d="M320 24 V38" stroke="rgba(185,28,75,0.3)" stroke-width="3" stroke-linecap="round" transform="rotate(165 320 320)"/><path d="M320 24 V48" stroke="rgba(185,28,75,0.45)" stroke-width="5" stroke-linecap="round" transform="rotate(180 320 320)"/><path d="M320 24 V38" stroke="rgba(185,28,75,0.3)" stroke-width="3" stroke-linecap="round" transform="rotate(195 320 320)"/><path d="M320 24 V48" stroke="rgba(185,28,75,0.45)" stroke-width="5" stroke-linecap="round" transform="rotate(210 320 320)"/><path d="M320 24 V38" stroke="rgba(185,28,75,0.3)" stroke-width="3" stroke-linecap="round" transform="rotate(225 320 320)"/><path d="M320 24 V48" stroke="rgba(185,28,75,0.45)" stroke-width="5" stroke-linecap="round" transform="rotate(240 320 320)"/><path d="M320 24 V38" stroke="rgba(185,28,75,0.3)" stroke-width="3" stroke-linecap="round" transform="rotate(255 320 320)"/><path d="M320 24 V48" stroke="rgba(185,28,75,0.45)" stroke-width="5" stroke-linecap="round" transform="rotate(270 320 320)"/><path d="M320 24 V38" stroke="rgba(185,28,75,0.3)" stroke-width="3" stroke-linecap="round" transform="rotate(285 320 320)"/><path d="M320 24 V48" stroke="rgba(185,28,75,0.45)" stroke-width="5" stroke-linecap="round" transform="rotate(300 320 320)"/><path d="M320 24 V38" stroke="rgba(185,28,75,0.3)" stroke-width="3" stroke-linecap="round" transform="rotate(315 320 320)"/><path d="M320 24 V48" stroke="rgba(185,28,75,0.45)" stroke-width="5" stroke-linecap="round" transform="rotate(330 320 320)"/><path d="M320 24 V38" stroke="rgba(185,28,75,0.3)" stroke-width="3" stroke-linecap="round" transform="rotate(345 320 320)"/></g>

  <g class="eg-nodes">
    <circle cx="320" cy="76" r="13" fill="#f59e0b"/>
    <circle cx="546" cy="466" r="10" fill="#ea580c"/>
    <circle cx="104" cy="446" r="9" fill="#b91c4b"/>
  </g>

  
    <!-- baseline: the line everything stands on -->
    <path d="M176 408 H464" fill="none" stroke="#b91c4b" stroke-width="12" stroke-linecap="round" opacity=".45"/>
    <!-- A : two diagonals and the crossbar that opens the counter -->
    <path d="M212 408 L272 244 L332 408" fill="none" stroke="#b91c4b" stroke-width="18"
          stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M238 344 H306" fill="none" stroke="#ea580c" stroke-width="13" stroke-linecap="round"/>
    <!-- a : the x-height letter, bowl plus stem -->
    <circle cx="410" cy="352" r="42" fill="none" stroke="#ea580c" stroke-width="16"/>
    <path d="M452 310 V408" fill="none" stroke="#f59e0b" stroke-width="14" stroke-linecap="round"/>
    <!-- x-height rule, dashed: the invisible grid of a Latin page -->
    <path d="M186 292 H454" fill="none" stroke="#b91c4b" stroke-width="5" stroke-linecap="round"
          stroke-dasharray="2 18" opacity=".55"/>
    

  <!-- the four corners carry the same motif the page background repeats -->
  <g opacity=".45" fill="none" stroke="#b91c4b" stroke-width="3">
    <path d="M92 132 h34 M92 132 v34"/>
    <path d="M548 132 h-34 M548 132 v34"/>
    <path d="M92 508 h34 M92 508 v-34"/>
    <path d="M548 508 h-34 M548 508 v-34"/>
  </g>
</svg>
