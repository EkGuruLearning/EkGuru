<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640"
     role="img" aria-labelledby="t">
  <title id="t">EkGuru world emblem — many scripts</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#f3f1fc"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f32d9" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity=".35"/>
    </linearGradient>
  </defs>

  <!-- The backdrop is a circle, not a square: on the dark heroes (support/,
       courses/) a square panel shows its corners and reads as a broken image. -->
  <circle cx="320" cy="320" r="288" fill="url(#bg)"/>
  <circle cx="320" cy="320" r="288" fill="#f3f1fc" fill-opacity=".55"/>

  <!-- rim: dashed orbit, ticks, and the three study nodes -->
  <circle cx="320" cy="320" r="288" fill="none" stroke="#4f32d9" stroke-opacity=".16"
          stroke-width="2" stroke-dasharray="10 14"/>
  <circle cx="320" cy="320" r="252" fill="none" stroke="url(#ring)" stroke-width="2"/>
  <g opacity=".8"><path d="M320 24 V48" stroke="rgba(79,50,217,0.45)" stroke-width="5" stroke-linecap="round" transform="rotate(0 320 320)"/><path d="M320 24 V38" stroke="rgba(79,50,217,0.3)" stroke-width="3" stroke-linecap="round" transform="rotate(15 320 320)"/><path d="M320 24 V48" stroke="rgba(79,50,217,0.45)" stroke-width="5" stroke-linecap="round" transform="rotate(30 320 320)"/><path d="M320 24 V38" stroke="rgba(79,50,217,0.3)" stroke-width="3" stroke-linecap="round" transform="rotate(45 320 320)"/><path d="M320 24 V48" stroke="rgba(79,50,217,0.45)" stroke-width="5" stroke-linecap="round" transform="rotate(60 320 320)"/><path d="M320 24 V38" stroke="rgba(79,50,217,0.3)" stroke-width="3" stroke-linecap="round" transform="rotate(75 320 320)"/><path d="M320 24 V48" stroke="rgba(79,50,217,0.45)" stroke-width="5" stroke-linecap="round" transform="rotate(90 320 320)"/><path d="M320 24 V38" stroke="rgba(79,50,217,0.3)" stroke-width="3" stroke-linecap="round" transform="rotate(105 320 320)"/><path d="M320 24 V48" stroke="rgba(79,50,217,0.45)" stroke-width="5" stroke-linecap="round" transform="rotate(120 320 320)"/><path d="M320 24 V38" stroke="rgba(79,50,217,0.3)" stroke-width="3" stroke-linecap="round" transform="rotate(135 320 320)"/><path d="M320 24 V48" stroke="rgba(79,50,217,0.45)" stroke-width="5" stroke-linecap="round" transform="rotate(150 320 320)"/><path d="M320 24 V38" stroke="rgba(79,50,217,0.3)" stroke-width="3" stroke-linecap="round" transform="rotate(165 320 320)"/><path d="M320 24 V48" stroke="rgba(79,50,217,0.45)" stroke-width="5" stroke-linecap="round" transform="rotate(180 320 320)"/><path d="M320 24 V38" stroke="rgba(79,50,217,0.3)" stroke-width="3" stroke-linecap="round" transform="rotate(195 320 320)"/><path d="M320 24 V48" stroke="rgba(79,50,217,0.45)" stroke-width="5" stroke-linecap="round" transform="rotate(210 320 320)"/><path d="M320 24 V38" stroke="rgba(79,50,217,0.3)" stroke-width="3" stroke-linecap="round" transform="rotate(225 320 320)"/><path d="M320 24 V48" stroke="rgba(79,50,217,0.45)" stroke-width="5" stroke-linecap="round" transform="rotate(240 320 320)"/><path d="M320 24 V38" stroke="rgba(79,50,217,0.3)" stroke-width="3" stroke-linecap="round" transform="rotate(255 320 320)"/><path d="M320 24 V48" stroke="rgba(79,50,217,0.45)" stroke-width="5" stroke-linecap="round" transform="rotate(270 320 320)"/><path d="M320 24 V38" stroke="rgba(79,50,217,0.3)" stroke-width="3" stroke-linecap="round" transform="rotate(285 320 320)"/><path d="M320 24 V48" stroke="rgba(79,50,217,0.45)" stroke-width="5" stroke-linecap="round" transform="rotate(300 320 320)"/><path d="M320 24 V38" stroke="rgba(79,50,217,0.3)" stroke-width="3" stroke-linecap="round" transform="rotate(315 320 320)"/><path d="M320 24 V48" stroke="rgba(79,50,217,0.45)" stroke-width="5" stroke-linecap="round" transform="rotate(330 320 320)"/><path d="M320 24 V38" stroke="rgba(79,50,217,0.3)" stroke-width="3" stroke-linecap="round" transform="rotate(345 320 320)"/></g>

  <g class="eg-nodes">
    <circle cx="320" cy="76" r="13" fill="#f0a020"/>
    <circle cx="546" cy="466" r="10" fill="#8b5cf6"/>
    <circle cx="104" cy="446" r="9" fill="#4f32d9"/>
  </g>

  
    <g stroke-linecap="round" fill="none">
      <!-- top-left: the Devanagari headstroke and its stems -->
      <path d="M168 232 H272" stroke="#4f32d9" stroke-width="13"/>
      <path d="M196 232 V278 M238 232 V298 H218" stroke="#4f32d9" stroke-width="10"/>
      <circle cx="220" cy="202" r="7" fill="#f0a020" stroke="none"/>
      <!-- top-right: the Arabic baseline, read from the right -->
      <path d="M366 286 q28 -44 60 -18 q16 12 40 -6" stroke="#8b5cf6" stroke-width="13"/>
      <circle cx="404" cy="228" r="8" fill="#f0a020" stroke="none"/>
      <!-- bottom-left: the CJK grid -->
      <path d="M168 380 H274 M168 414 H274 M221 358 V444" stroke="#8b5cf6" stroke-width="11"/>
      <!-- bottom-right: the Latin A -->
      <path d="M368 444 L414 354 L460 444" stroke="#f0a020" stroke-width="13"/>
      <path d="M388 408 H440" stroke="#4f32d9" stroke-width="10"/>
      <!-- the shared centre: what every script has in common -->
      <circle cx="318" cy="330" r="24" fill="none" stroke="#4f32d9" stroke-width="11"/>
      <circle cx="318" cy="330" r="7" fill="#f0a020" stroke="none"/>
    </g>
    

  <!-- the four corners carry the same motif the page background repeats -->
  <g opacity=".45" fill="none" stroke="#4f32d9" stroke-width="3">
    <path d="M92 132 h34 M92 132 v34"/>
    <path d="M548 132 h-34 M548 132 v34"/>
    <path d="M92 508 h34 M92 508 v-34"/>
    <path d="M548 508 h-34 M548 508 v-34"/>
  </g>
</svg>
