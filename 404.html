<!--
  GitHub Pages serves this file for ANY missing URL, at whatever depth was
  requested. So /EkGuru/tutor/nope/ would resolve relative links against
  that folder and break them.

  The script below works out the site root from the current path at runtime,
  which means the same file is correct on ekgurulearning.github.io/EkGuru/
  AND on a custom domain later, with nothing to edit.
-->
<script>
(function () {
  var p = location.pathname.split("/").filter(Boolean);
  /* On github.io the first path segment is the repository name. On a custom
     domain there is no such prefix. */
  var root = (location.hostname.indexOf("github.io") > -1 && p.length) ? "/" + p[0] + "/" : "/";
  document.write('<base href="' + root + '">');
  document.documentElement.setAttribute("data-root", root);
})();
</script>
